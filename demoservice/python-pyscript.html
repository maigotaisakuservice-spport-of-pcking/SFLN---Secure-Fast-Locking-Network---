<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Cloud Python Controller - SFLN Demo</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        .terminal { background: #000; color: #0f0; padding: 20px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; min-height: 200px; margin-top: 20px; border: 1px solid #333; }
        .control-panel { background: var(--card-bg-color); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); }
        .device { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding: 10px; background: #222; border-radius: 8px; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #555; }
        .status-online { background: #0f0; box-shadow: 0 0 8px #0f0; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="../index.html" class="logo">SFLN</a>
        </div>
    </header>

    <main class="container">
        <h1>Cloud Python Controller</h1>
        <p style="color: var(--secondary-text-color);">PyScript を使用してブラウザ上で Python SDK を実行。セキュアな IoT 制御を想定しています。</p>

        <div class="control-panel" style="margin-top: 30px;">
            <h3>制御デバイス一覧</h3>
            <div class="device">
                <div class="status-dot status-online"></div>
                <div style="flex: 1;">
                    <strong>Edge-Node-01 (Smart Factory)</strong><br>
                    <span style="font-size: 0.8rem; color: #888;">ID: 7f82-a9b1-sfln</span>
                </div>
                <button class="cta-button" style="padding: 5px 15px;">コマンド送信</button>
            </div>
            <div class="device">
                <div class="status-dot status-online"></div>
                <div style="flex: 1;">
                    <strong>Security-Cam-04</strong><br>
                    <span style="font-size: 0.8rem; color: #888;">ID: e2d1-f4c5-sfln</span>
                </div>
                <button class="cta-button" style="padding: 5px 15px;">ライブ映像</button>
            </div>
        </div>

        <div class="terminal" id="terminal-out">
            <div>[SFLN-PyScript] Initializing Python Environment...</div>
            <div id="py-status">...</div>
        </div>

        <script type="py">
            import sys
            from pyscript import display

            # Simulated SFLN SDK in PyScript
            class SFLNSDKDemo:
                def __init__(self):
                    self.status = "CONNECTED"

                def send_command(self, target, cmd):
                    return f"Encrypted Command '{cmd}' sent to {target} via SFLN-P."

            sdk = SFLNSDKDemo()
            display(f"> SFLN Python SDK {sdk.status}", target="py-status")
            display(f"> {sdk.send_command('Edge-Node-01', 'REBOOT')}", target="terminal-out", append=True)
        </script>

        <p style="margin-top: 20px;"><a href="index.html">← Demo Hubに戻る</a></p>
    </main>
</body>
</html>
