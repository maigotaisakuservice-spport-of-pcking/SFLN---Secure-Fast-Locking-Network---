<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Secure Transfer Web - SFLN Demo</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .service-ui { background: #fff; color: #333; min-height: 80vh; border-radius: 12px; display: flex; overflow: hidden; }
        .sidebar-ui { width: 240px; background: #f8f9fa; border-right: 1px solid #ddd; padding: 20px; }
        .main-ui { flex: 1; padding: 40px; }
        .nav-item { padding: 12px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; color: #555; }
        .nav-item.active { background: #e7f3ff; color: #007bff; font-weight: bold; }
        .drop-zone { border: 2px dashed #007bff; background: #f0f7ff; padding: 60px; text-align: center; border-radius: 12px; margin-top: 20px; }
        .file-list { margin-top: 30px; }
        .file-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; align-items: center; }
        .badge-sfln { background: #58a6ff; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; }
    </style>
</head>
<body style="background: #e9ecef;">
    <div class="container" style="padding-top: 40px;">
        <div class="service-ui">
            <aside class="sidebar-ui">
                <h2 style="color: #007bff; border: none; font-size: 1.5rem;">SFLN Cloud</h2>
                <div class="nav-item active">ファイル転送</div>
                <div class="nav-item">共有リンク</div>
                <div class="nav-item">セキュリティ設定</div>
            </aside>
            <main class="main-ui">
                <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h3>セキュア転送</h3>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div id="qrcode-small" style="background: white; padding: 5px; border-radius: 4px;"></div>
                        <div style="font-size: 0.8rem;">ID: <code id="user-id">Initializing...</code></div>
                    </div>
                </header>

                <div id="setup-view">
                    <h4>接続相手のペアリング</h4>
                    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
                        <p style="font-size: 0.85rem; color: #555;">他のタブを開いて、そこに表示されるIDを入力するか、QRコードでリンクしてください。</p>
                        <div style="display: flex; gap: 10px; margin-top: 10px;">
                            <input type="text" id="target-id" placeholder="相手のノードIDを入力" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                            <button class="cta-button" onclick="pairNode()" style="padding: 5px 15px;">ペアリング</button>
                        </div>
                        <button class="cta-button" style="background: #6c757d; margin-top: 10px;" onclick="window.open(window.location.href, '_blank')">新しいタブで自分と通信する</button>
                    </div>
                </div>

                <div id="transfer-view" style="display: none;">
                    <div class="drop-zone" id="drop-zone">
                        <p>ここにファイルをドラッグ＆ドロップ</p>
                        <input type="file" id="file-input" style="display: none;" onchange="sendFile(event)">
                        <button class="cta-button" style="margin-top: 10px;" onclick="document.getElementById('file-input').click()">ファイルを選択</button>
                        <p style="font-size: 0.75rem; color: #777; margin-top: 10px;">SFLN 12,000桁暗号により、サーバーを通さず直接相手に届きます。</p>
                    </div>

                    <div id="progress-container" style="display: none; margin-top: 20px; background: #eee; height: 10px; border-radius: 5px; overflow: hidden;">
                        <div id="progress-bar" style="width: 0%; height: 100%; background: #58a6ff; transition: width 0.1s;"></div>
                    </div>
                    <p id="transfer-status" style="font-size: 0.8rem; text-align: center; margin-top: 5px; color: #555;"></p>
                </div>

                <div class="file-list">
                    <h4>転送履歴 & 受信済み</h4>
                    <div id="received-files"></div>
                    <div class="file-item">
                        <div>
                            <strong>financial_report_2025.pdf</strong><br>
                            <span style="font-size: 0.75rem; color: #999;">12.4 MB • 2分前</span>
                        </div>
                        <span class="badge-sfln">SFLN SECURE</span>
                    </div>
                    <div class="file-item">
                        <div>
                            <strong>contract_v2.docx</strong><br>
                            <span style="font-size: 0.75rem; color: #999;">1.1 MB • 1時間前</span>
                        </div>
                        <span class="badge-sfln">SFLN SECURE</span>
                    </div>
                </div>
            </main>
        </div>
        <p style="text-align: center; margin-top: 20px;"><a href="index.html">← Demo Hubに戻る</a></p>
    </div>

    <script src="../sfln/js-library/sfln.js"></script>
    <script>
        const bc = new BroadcastChannel('sfln_mesh_v2');
        const client = new SFLNClientJS();
        let pairedNode = null;

        window.onload = () => {
            document.getElementById('user-id').innerText = client.nodeId;
            new QRCode(document.getElementById('qrcode-small'), {
                text: client.nodeId,
                width: 40, height: 40
            });
            log("SFLNノードが起動しました。");
        };

        function pairNode() {
            const target = document.getElementById('target-id').value;
            if (target) {
                pairedNode = target;
                document.getElementById('setup-view').style.display = 'none';
                document.getElementById('transfer-view').style.display = 'block';
                log(`ノード ${target.substring(0,8)}... とペアリングしました。`);
            }
        }

        bc.onmessage = (ev) => {
            const data = ev.data;
            if (data.type === 'HEARTBEAT') return;

            if (data.to === client.nodeId) {
                if (data.type === 'START') {
                    log(`ファイル受信開始: ${data.name} (${data.size} bytes)`);
                    updateProgress(0, `受信中: ${data.name}`);
                } else if (data.type === 'CHUNK') {
                    updateProgress(data.progress, `受信中... ${data.progress}%`);
                } else if (data.type === 'END') {
                    log(`ファイル受信完了: ${data.name}`);
                    updateProgress(100, `受信完了！`);
                    addFileItem(data.name, data.size, true);
                }
            }
        };

        async function sendFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            log(`ファイル送信開始: ${file.name}`);
            bc.postMessage({ type: 'START', from: client.nodeId, to: pairedNode, name: file.name, size: file.size });

            for (let i = 0; i <= 100; i += 10) {
                updateProgress(i, `送信中... ${i}%`);
                bc.postMessage({ type: 'CHUNK', from: client.nodeId, to: pairedNode, progress: i });
                await new Promise(r => setTimeout(r, 200));
            }

            bc.postMessage({ type: 'END', from: client.nodeId, to: pairedNode, name: file.name, size: file.size });
            log(`ファイル送信完了: ${file.name}`);
            addFileItem(file.name, file.size, false);
        }

        function updateProgress(val, text) {
            const container = document.getElementById('progress-container');
            const bar = document.getElementById('progress-bar');
            const status = document.getElementById('transfer-status');
            container.style.display = 'block';
            bar.style.width = val + '%';
            status.innerText = text;
            if (val >= 100) {
                setTimeout(() => { container.style.display = 'none'; status.innerText = ''; }, 2000);
            }
        }

        function addFileItem(name, size, isReceived) {
            const list = document.getElementById('received-files');
            const item = document.createElement('div');
            item.className = 'file-item';
            const sizeStr = (size / 1024 / 1024).toFixed(2) + ' MB';
            item.innerHTML = `
                <div>
                    <strong>${name}</strong><br>
                    <span style="font-size: 0.75rem; color: #999;">${sizeStr} • ${isReceived ? '受信済' : '送信済'}</span>
                </div>
                <span class="badge-sfln">SFLN SECURE</span>
            `;
            list.prepend(item);
        }

        function log(msg) {
            console.log("[SFLN-UI]", msg);
        }
    </script>
</body>
</html>
