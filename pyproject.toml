[tool.briefcase]
project_name = "SFLN"
bundle = "si.f5.pdg"
version = "1.0.0"
url = "https://sfln-server.pdg.f5.si"
author = "TekipakiPC"
author_email = "tekipakipc@f5.si"

[tool.briefcase.app.sfln]
formal_name = "SFLN Client"
description = "Secure Fast Locking Network Client by TekipakiPC"
icon = "resources/sfln"
sources = ["sfln"]
requires = ["cryptography", "websockets"]

[tool.briefcase.app.sfln.macOS]
universal_build = true
requires = ["PySide6"]

[tool.briefcase.app.sfln.linux]
requires = ["PySide6"]

[tool.briefcase.app.sfln.windows]
requires = ["PySide6"]

[tool.briefcase.app.sfln.android]
requires = ["chaquopy"]
console_app = false
