<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFLN-Crypto.js Demonstration</title>
    <style>
        body { font-family: sans-serif; padding: 2em; }
        #status { padding: 1em; font-weight: bold; border-radius: 5px; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .failure { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>SFLN-Crypto.js Demonstration</h1>
    <p>This page tests the SFLN-A JavaScript decryption library.</p>
    <p>Status: <span id="status">Testing...</span></p>

    <script src="sfln-crypto.js"></script>
    <script>
        async function runTest() {
            const statusEl = document.getElementById('status');
            try {
                // 1. Fetch the test data generated by the Python script
                const response = await fetch('js_test_data.json');
                if (!response.ok) {
                    throw new Error(`Failed to fetch test data: ${response.statusText}`);
                }
                const testData = await response.json();
                console.log("Successfully loaded test data:", testData);

                const originalMessage = testData.original_message;

                // 2. Convert the chunk data from arrays of numbers to ArrayBuffers
                const chunksAsArrayBuffers = testData.chunks.map(chunkArray => {
                    const uint8 = new Uint8Array(chunkArray);
                    return uint8.buffer;
                });
                console.log("Converted chunks to ArrayBuffers:", chunksAsArrayBuffers);

                // 3. Run the decryption process
                const decryptedUint8Array = await sfln.reassembleAndDecrypt(chunksAsArrayBuffers);
                console.log("Decryption process finished.");

                // 4. Decode the result and verify it
                const decryptedMessage = new TextDecoder().decode(decryptedUint8Array);
                console.log("Original message:  ", originalMessage);
                console.log("Decrypted message: ", decryptedMessage);

                if (decryptedMessage === originalMessage) {
                    statusEl.textContent = 'SUCCESS: Decrypted data matches the original message.';
                    statusEl.className = 'success';
                    console.log("SUCCESS!");
                } else {
                    statusEl.textContent = 'FAILURE: Decrypted data does not match the original.';
                    statusEl.className = 'failure';
                    console.error("FAILURE!");
                }

            } catch (error) {
                statusEl.textContent = `FAILURE: An error occurred - ${error.message}`;
                statusEl.className = 'failure';
                console.error("Test failed with an error:", error);
            }
        }

        // Run the test when the page loads
        window.onload = runTest;
    </script>
</body>
</html>
