<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFLN - Interactive Demo</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .demo-container { max-width: 800px; margin: 100px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 100px; padding: 10px; margin-bottom: 20px; font-family: monospace; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: #f0f0f0; padding: 15px; border-radius: 4px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #0078D7; }
        .mesh-view { height: 200px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; background: #fafafa; }
        .btn { display: inline-block; padding: 10px 20px; background: #0078D7; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #005A9E; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">SFLN</a>
            <nav>
                <ul>
                    <li><a href="index.html">トップ</a></li>
                    <li><a href="demo.html">Demo</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="demo-container">
        <h1>SFLN インタラクティブ・デモ</h1>
        <p>12,000桁（40,000ビット）の暗号化と、次世代メッシュネットワークをブラウザ上で体験してください。</p>

        <section>
            <h3>12,000桁 暗号化シミュレーター</h3>
            <textarea id="plain-text" placeholder="ここにテキストを入力してください...">究極のセキュリティ、圧倒的な速度、絶対的な安定性。</textarea>
            <button class="btn" onclick="demoEncrypt()">SFLNで安全に送信</button>
            <div id="crypto-stats" style="margin-top: 10px; display: none;">
                <p>✅ 暗号化完了: <strong>1,024 byte chunks x <span id="chunk-count"></span></strong></p>
                <p>🔑 使用鍵長: <strong>40,000 bits (12,000 digits equiv.)</strong></p>
            </div>
        </section>

        <hr style="margin: 40px 0;">

        <section>
            <h3>自己増殖型メッシュネットワーク ステータス</h3>
            <div class="stats-grid">
                <div class="stat-box">
                    <p>接続ノード数</p>
                    <div class="stat-value" id="node-count">12,482</div>
                </div>
                <div class="stat-box">
                    <p>平均通信速度</p>
                    <div class="stat-value" id="avg-speed">1.04 GB/s</div>
                </div>
            </div>
            <div class="mesh-view" id="mesh-visual">
                [メッシュネットワークの可視化：準備中]
            </div>
        </section>
    </main>

    <script src="sfln/js-library/sfln.js"></script>
    <script>
        const sflnClient = new SFLNCryptoJS();

        async function demoEncrypt() {
            const text = document.getElementById('plain-text').value;
            const data = new TextEncoder().encode(text);
            const chunks = await sflnClient.encryptData(data);

            document.getElementById('crypto-stats').style.display = 'block';
            document.getElementById('chunk-count').innerText = chunks.length;

            // Re-animate stats
            const nodeVal = document.getElementById('node-count');
            nodeVal.innerText = (parseInt(nodeVal.innerText.replace(',', '')) + 1).toLocaleString();
        }

        // Fake network activity
        setInterval(() => {
            const speedVal = document.getElementById('avg-speed');
            const newSpeed = 1.0 + (Math.random() * 0.1);
            speedVal.innerText = newSpeed.toFixed(2) + " GB/s";
        }, 2000);
    </script>
</body>
</html>
