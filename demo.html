<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFLN - Offline Demo</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Load stable libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        .demo-container { max-width: 800px; margin: 50px auto; padding: 30px; background: var(--card-bg-color); border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .qr-section { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 25px; background: #0d1117; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 30px; }
        #qrcode { background: white; padding: 15px; border-radius: 8px; min-height: 128px; min-width: 128px; }
        #qrcode img { margin: 0 auto; }
        .btn { display: inline-block; padding: 12px 24px; background: var(--accent-color); color: var(--bg-color); text-decoration: none; border-radius: 6px; border: none; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: all 0.2s; text-align: center; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--primary-text-color); margin-top: 10px; }
        #status-area { margin-top: 30px; padding: 15px; border-radius: 6px; background: #1c2128; border: 1px solid var(--border-color); }
        code { background: #2d333b; padding: 4px 8px; border-radius: 4px; font-family: monospace; color: var(--accent-color); font-size: 0.9rem; }
        .progress-container { height: 14px; background: #21262d; border-radius: 7px; overflow: hidden; margin: 20px 0; border: 1px solid var(--border-color); display: none; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent-color); transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent-color); }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">SFLN</a>
            <nav>
                <ul>
                    <li><a href="index.html#about">SFLNとは</a></li>
                    <li><a href="demo.html" class="active">Demo</a></li>
                    <li><a href="docs.html">Docs</a></li>
                    <li><a href="index.html#download">ダウンロード</a></li>
                    <li><a href="dev-news.html">開発ニュース</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="demo-container">
        <h1 style="text-align: center; margin-bottom: 10px;">SFLN 12,000桁暗号体験</h1>
        <p style="color: var(--secondary-text-color); text-align: center; margin-bottom: 30px;">
            このデモはブラウザ内で完結します。実際の P2P 通信はダウンロード版アプリをご利用ください。
        </p>

        <section style="padding: 0;">
            <div class="qr-section">
                <div id="qrcode"></div>
                <div style="text-align: center;">
                    <p style="font-size: 0.85rem; color: var(--secondary-text-color); margin-bottom: 5px;">あなたの一時ノードID:</p>
                    <code id="my-id">Initializing...</code>
                </div>
                <button class="btn" onclick="window.open(window.location.href, '_blank')">別タブを開いて受信テストをする</button>
            </div>
        </section>

        <section id="transfer-section" style="padding: 0;">
            <h3>ファイルを暗号化して「送信」シミュレーション</h3>
            <div style="border: 2px dashed var(--border-color); padding: 40px; text-align: center; margin-top: 15px; border-radius: 12px; background: rgba(88,166,255,0.05);">
                <input type="file" id="file-input" style="display: none;" onchange="handleFileSelect(event)">
                <button class="btn" style="width: auto;" onclick="document.getElementById('file-input').click()">ファイルを選択</button>
                <p style="font-size: 0.8rem; color: var(--secondary-text-color); margin-top: 15px;">選択したファイルは 12,000桁暗号で断片化され、全タブへ放送されます。</p>
            </div>

            <div id="transfer-view" class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="status-text" style="font-size: 0.9rem; text-align: center; color: var(--accent-color); min-height: 1.2em;"></p>
        </section>

        <div id="status-area">
            <div id="log-content" style="font-family: monospace; font-size: 0.8rem; height: 120px; overflow-y: auto; color: #8b949e;">
                <div>> SFLN JS Engine Ready.</div>
            </div>
        </div>
    </main>

    <!-- Fallback if qrcode.js is not loaded -->
    <script>
        if (typeof QRCode === 'undefined') {
            document.write('<script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"><\/script>');
        }
    </script>
    <script src="sfln/js-library/sfln.js"></script>
    <script>
        const bc = new BroadcastChannel('sfln_secure_bridge');
        let client;

        function log(msg) {
            const div = document.createElement('div');
            div.innerText = "> " + msg;
            const container = document.getElementById('log-content');
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        window.onload = () => {
            try {
                client = new SFLNClientJS();
                document.getElementById('my-id').innerText = client.nodeId;

                if (typeof QRCode !== 'undefined') {
                    new QRCode(document.getElementById('qrcode'), {
                        text: client.nodeId,
                        width: 128, height: 128,
                        colorDark : "#0d1117", colorLight : "#ffffff"
                    });
                }
                log("SFLN ローカルメッシュが有効です。ID: " + client.nodeId);
            } catch (e) {
                console.error(e);
                log("初期化エラー。");
            }
        };

        bc.onmessage = async (ev) => {
            log(`他ノード (${ev.data.from.substring(0,8)}...) から ${ev.data.size} bytes のデータパケットを受信。`);
            document.getElementById('status-text').innerText = "🔐 他タブから暗号化データを受信し、復号しました！";
        };

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('transfer-view').style.display = 'block';
            const bar = document.getElementById('progress-bar');
            const status = document.getElementById('status-text');

            log(`${file.name} を 1,024 byte のセルに分割中...`);
            status.innerText = "12,000桁暗号を適用中...";

            // Simulate progress
            for (let i = 0; i <= 100; i += 5) {
                bar.style.width = i + "%";
                await new Promise(r => setTimeout(r, 30));
            }

            bc.postMessage({
                from: client.nodeId,
                size: file.size,
                name: file.name
            });

            log("全ての暗号化断片をブロードキャスト送信完了。");
            status.innerText = "✅ 送信完了！他のタブで受信を確認してください。";
        }
    </script>
</body>
</html>
