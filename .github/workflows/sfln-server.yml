name: SFLN Server Control

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography websockets

    - name: Update f5.si IP Address
      run: |
        curl -s "https://f5.si/update.php?domain=sfln-server.pdg.f5.si&password=2d4a704921a716d36bd7dfa3a3d8d74e"

    - name: Start SFLN Server
      run: |
        echo "Starting SFLN Server (UDP:9000, WS:9001)..."
        python3 sfln/server/main.py &
        SERVER_PID=$!
        echo "Server running with PID $SERVER_PID. It will auto-stop in 1 hour."
        sleep 3600
        kill $SERVER_PID
        echo "Server stopped."
