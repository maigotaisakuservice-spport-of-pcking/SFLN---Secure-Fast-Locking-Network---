name: SFLN Continuous Integration

on:
  workflow_dispatch: 
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography psutil PySide6 websockets

    - name: Run SFLN Integrated Core Features Tests (A-F)
      run: |
        # We set QT_QPA_PLATFORM to offscreen for GUI-related tests in headless CI
        export QT_QPA_PLATFORM=offscreen
        python3 sfln/tests/full_test.py

    - name: Run SFLN Relay Integration Test
      run: |
        python3 sfln/tests/integration_test.py

    - name: Run SFLN Performance Tests (10MB, 100MB, 1GB, 10GB, 100GB, 1000GB 10000GB)
      run: |
        python3 sfln/tests/performance_test.py --size 0.01
        python3 sfln/tests/performance_test.py --size 0.1
        python3 sfln/tests/performance_test.py --size 1.0
        python3 sfln/tests/performance_test.py --size 10.0
        python3 sfln/tests/performance_test.py --size 100.0
        python3 sfln/tests/performance_test.py --size 1000.0
        python3 sfln/tests/performance_test.py --size 10000.0

    - name: Run SFLN Chaos & AI Routing Tests
      run: |
        python3 sfln/tests/chaos_test.py

    - name: Run SFLN Server Load Test
      run: |
        python3 sfln/tests/load_test.py

    - name: Run SFLN JavaScript Library Tests
      run: |
        node sfln/tests/js_test.js
