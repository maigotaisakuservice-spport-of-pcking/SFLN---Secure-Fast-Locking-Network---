name: SFLN Continuous Integration

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography psutil PySide6

    - name: Run SFLN Integrated Tests
      run: |
        # We set QT_QPA_PLATFORM to offscreen for GUI-related tests in headless CI
        export QT_QPA_PLATFORM=offscreen
        python3 sfln/tests/full_test.py

    - name: Run SFLN Relay Integration Test
      run: |
        python3 sfln/tests/integration_test.py

    - name: Run SFLN Performance Tests (10MB, 100MB, 1GB)
      run: |
        echo "Running 10MB test..."
        python3 sfln/tests/performance_test.py --size 0.01
        echo "Running 100MB test..."
        python3 sfln/tests/performance_test.py --size 0.1
        echo "Running 1GB test..."
        python3 sfln/tests/performance_test.py --size 1.0
