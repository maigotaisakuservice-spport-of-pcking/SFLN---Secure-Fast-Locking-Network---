name: SFLN Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python Integrated & Performance Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography psutil PySide6 websockets aiohttp keyring

    - name: Core Integrated Tests
      run: |
        export QT_QPA_PLATFORM=offscreen
        export PYTHONPATH=$PYTHONPATH:.
        python3 sfln/tests/full_test.py

    - name: Relay Integration Test
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python3 sfln/tests/integration_test.py

    - name: Chaos & AI Routing Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python3 sfln/tests/chaos_test.py

    - name: Server Load Test (100 Clients)
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python3 sfln/tests/load_test.py

    - name: Performance Tests (10MB, 100MB, 1GB, 10GB, 100GB, 1TB)
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # 10MB test
        python3 sfln/tests/performance_test.py --size 0.01
        # 100MB test
        python3 sfln/tests/performance_test.py --size 0.1
        # 1GB test
        python3 sfln/tests/performance_test.py --size 1.0
        # 10GB test
        python3 sfln/tests/performance_test.py --size 10.0
        # 100GB test
        python3 sfln/tests/performance_test.py --size 100.0
        # 1TB test (Simulated streaming)
        python3 sfln/tests/performance_test.py --size 1024.0

  js-test:
    name: JavaScript & NPM Library Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        npm install ws
    - name: Set up Python for Relay
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Start Relay Server for Testing
      run: |
        pip install websockets
        export PYTHONPATH=$PYTHONPATH:.
        python3 sfln/server/main.py > relay.log 2>&1 &
        sleep 5
    - name: Run JS Tests
      run: |
        node sfln/tests/js_test.js
    - name: Check Relay Log
      if: always()
      run: cat relay.log
