name: SFLN Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cryptography psutil PySide6 websockets

    - name: Run SFLN Integrated Tests
      run: |
        export QT_QPA_PLATFORM=offscreen
        python3 sfln/tests/full_test.py

    - name: Run SFLN Relay Integration Test
      run: |
        python3 sfln/tests/integration_test.py

  js-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd sfln/npm-library
        npm install
        npm install ws # for testing if not in package.json

    - name: Run SFLN JavaScript Library Tests
      run: |
        # Testing both raw JS and NPM library
        node sfln/tests/js_test.js

  npm-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: NPM Library Build Check
      run: |
        cd sfln/npm-library
        npm install
        # Add build steps if any
        # npm run build
